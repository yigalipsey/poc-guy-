# Local development only: Redis for the BullMQ queue. The database is the
# hosted Supabase project (buzz-poc), so there is nothing else to run here.
# Production Redis is managed by Coolify (see ticket 07 for the setup docs).
services:
  redis:
    image: redis:7-alpine
    # noeviction: queued jobs must never be evicted. AOF: survive a restart.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
